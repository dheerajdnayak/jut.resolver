{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">
                <h4><i class="fas fa-user-shield"></i> Admin Login</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {{ form.hidden_tag() }}
                    <div class="mb-3">
                        {{ form.username.label(class="form-label fw-bold") }}
                        {{ form.username(class="form-control") }}
                    </div>
                    <div class="mb-3">
                        {{ form.password.label(class="form-label fw-bold") }}
                        {{ form.password(class="form-control") }}
                    </div>
                    <button type="submit" class="btn btn-danger w-100">{{ form.submit.label }}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
